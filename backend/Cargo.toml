[package]
name = "suasobra-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
argon2 = { version = "=0.6.0", features = ["getrandom"] }
axum = "=0.8.9"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
dotenvy = "=0.15.7"
getrandom = "=0.4.3"
hex = "=0.4.3"
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "=2.6.1"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.27.0", features = ["serde"] }

[dev-dependencies]
http-body-util = "=0.1.5"
tower = { version = "=0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
